services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/stock.db
      APP_ENVIRONMENT: production
      APP_TOKEN: ${APP_TOKEN:?Set APP_TOKEN in .env before starting Docker}
    volumes:
      - stock-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      APP_TOKEN: ${APP_TOKEN:?Set APP_TOKEN in .env before starting Docker}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  stock-data:
